<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="1" />
      <stop offset="60%" stop-color="#0b081e" stop-opacity="1" />
      <stop offset="100%" stop-color="#030014" stop-opacity="1" />
    </radialGradient>

    <!-- Glowing Ring Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="goldOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <!-- Silhouette Mask -->
    <clipPath id="avatarClip">
      <circle cx="250" cy="250" r="210" />
    </clipPath>
  </defs>

  <!-- Outer Ambient Glow behind everything -->
  <circle cx="250" cy="250" r="180" fill="#6366f1" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="250" cy="250" r="140" fill="#06b6d4" opacity="0.1" filter="url(#softGlow)" />

  <!-- Main Circular Container -->
  <g clip-path="url(#avatarClip)">
    <!-- Base Background -->
    <circle cx="250" cy="250" r="210" fill="url(#bgGrad)" stroke="#1e1b4b" stroke-width="4" />

    <!-- Tech Grid Lines in Background -->
    <g opacity="0.15">
      <path d="M 40,250 L 460,250" stroke="#6366f1" stroke-width="1" stroke-dasharray="5 5" />
      <path d="M 250,40 L 250,460" stroke="#6366f1" stroke-width="1" stroke-dasharray="5 5" />
      <!-- Concentric tech circles -->
      <circle cx="250" cy="250" r="70" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 8" />
      <circle cx="250" cy="250" r="120" fill="none" stroke="#6366f1" stroke-width="1" />
      <circle cx="250" cy="250" r="170" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 4" />
    </g>

    <!-- Glowing Cyber Rings -->
    <circle cx="250" cy="250" r="195" fill="none" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#neonGlow)" opacity="0.8" />
    <circle cx="250" cy="250" r="202" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.5" />

    <!-- Code/Tech Floating Symbols -->
    <g font-family="monospace" font-size="12" fill="#06b6d4" opacity="0.4" font-weight="bold">
      <text x="80" y="150">&lt;code&gt;</text>
      <text x="350" y="160">const dev = {}</text>
      <text x="90" y="320">() =&gt; MERN</text>
      <text x="340" y="300">import React</text>
      <text x="210" y="90">&lt;React /&gt;</text>
    </g>

    <!-- Stylized Developer Silhouette & Gear -->
    <g transform="translate(0, 20)">
      <!-- Keyboard / Desk Glow -->
      <ellipse cx="250" cy="400" rx="120" ry="20" fill="#06b6d4" opacity="0.3" filter="url(#neonGlow)" />
      
      <!-- Developer Shoulders & Torso -->
      <path d="M 120,440 
               C 120,380 160,340 210,335 
               L 210,310 
               L 290,310 
               L 290,335 
               C 340,340 380,380 380,440 
               Z" 
            fill="#0f172a" 
            stroke="#1e293b" 
            stroke-width="3" />
      
      <!-- Inside Torso details (Hoodie line) -->
      <path d="M 210,335 C 230,360 270,360 290,335" fill="none" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#neonGlow)" />
      <path d="M 250,358 L 250,420" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.5" />

      <!-- Neck -->
      <rect x="235" y="285" width="30" height="35" rx="5" fill="#1e293b" />

      <!-- Head / Face silhouette -->
      <rect x="210" y="195" width="80" height="100" rx="40" fill="#0f172a" stroke="#334155" stroke-width="2" />
      
      <!-- Stylish Tech Glasses / HUD overlay -->
      <g filter="url(#neonGlow)">
        <!-- Glasses Frame -->
        <rect x="220" y="230" width="26" height="16" rx="4" fill="none" stroke="#06b6d4" stroke-width="3" />
        <rect x="254" y="230" width="26" height="16" rx="4" fill="none" stroke="#06b6d4" stroke-width="3" />
        <line x1="246" y1="238" x2="254" y2="238" stroke="#06b6d4" stroke-width="3" />
        <!-- Glowing Lens reflections -->
        <path d="M 223,243 L 235,233" stroke="#fff" stroke-width="2" opacity="0.8" />
        <path d="M 257,243 L 269,233" stroke="#fff" stroke-width="2" opacity="0.8" />
      </g>

      <!-- Headphone/Audio gear (Tech vibe) -->
      <g>
        <!-- Headband -->
        <path d="M 205,230 C 205,170 295,170 295,230" fill="none" stroke="#334155" stroke-width="5" />
        <path d="M 205,230 C 205,170 295,170 295,230" fill="none" stroke="url(#cyanPurple)" stroke-width="2" />
        <!-- Ear Cups -->
        <rect x="198" y="215" width="12" height="35" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#neonGlow)" />
        <rect x="290" y="215" width="12" height="35" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#neonGlow)" />
      </g>
      
      <!-- Glowing Hair/Cap outline -->
      <path d="M 210,210 C 220,185 280,185 290,210" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#neonGlow)" opacity="0.8" />
    </g>
  </g>

  <!-- Glowing HUD target ring elements around the avatar -->
  <path d="M 50,110 A 210,210 0 0,1 110,50" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#neonGlow)" />
  <path d="M 390,50 A 210,210 0 0,1 450,110" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#neonGlow)" />
  <path d="M 450,390 A 210,210 0 0,1 390,450" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#neonGlow)" />
  <path d="M 110,450 A 210,210 0 0,1 50,390" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#neonGlow)" />
</svg>
